name: Statutory & Regulatory Monitor

on:
  schedule:
    # Run daily at 06:00 UTC for legally defensible compliance monitoring across US, EU, UK & State feeds
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mock:
        description: 'Simulate regulatory updates for pipeline testing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bot-statutory-update-review
  cancel-in-progress: false

jobs:
  monitor:
    name: Consolidated Regulatory & Statute Monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Verify TypeScript & Test Suite
        run: |
          npx tsc --noEmit
          npm run build
          npm test

      - name: Query Federal Register, EUR-Lex, UK & State Regulatory Feeds
        id: check_statutes
        run: |
          if [ "${{ inputs.mock }}" = "true" ]; then
            node scripts/check-statutory-updates.mjs --mock
          else
            node scripts/check-statutory-updates.mjs
          fi

      - name: Create Pull Request on Statutory Change
        id: cpr
        if: steps.check_statutes.outputs.has_updates == 'true' || steps.check_statutes.outputs.check_failed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(legal): statutory update notices detected by consolidated policy monitor'
          branch: bot/statutory-update-review
          delete-branch: true
          title: '[Legal Update] Statutory & Regulatory Changes Detected across Federal, State & International Feeds'
          body-path: statutory-update-report.md
          labels: |
            statutory-review
            needs-attorney-review
          draft: true
